<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contacto | Iván Zheng</title>
  <link rel="icon" type="image/svg+xml" href="./Resources/pfp.jpg" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --black: #0a0a0a;
      --white: #ffffff;
      --copy-small: #d9d9d9;
      --panel-card: #151515;
      --content-width: 1240px;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--black);
      color: var(--white);
      font-family: 'Inter', sans-serif;
      font-size: 16px;
      line-height: 1.72;
      overflow-x: hidden;
    }

    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      background: transparent;
      border-bottom: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 56px;
      height: 64px;
    }
    nav .nav-left { display: flex; gap: 32px; }
    nav .nav-center {
      position: absolute; left: 50%; transform: translateX(-50%);
      font-family: 'Playfair Display', serif;
      font-size: 24px; letter-spacing: 0.01em;
    }
    nav .nav-center a {
      color: var(--white);
      text-decoration: none;
      font-family: inherit;
      font-size: inherit;
      letter-spacing: inherit;
    }
    nav .nav-center a:hover { opacity: 0.75; }
    nav .nav-right { display: flex; gap: 32px; }
    nav a {
      color: var(--white);
      text-decoration: none;
      font-size: 15px;
      font-weight: 400;
      opacity: 0.85;
      transition: opacity .2s;
    }
    nav a:hover { opacity: 1; }
    nav .nav-toggle {
      display: none;
      background: transparent;
      border: 0;
      padding: 8px 4px;
      cursor: pointer;
      flex-direction: column;
      justify-content: center;
      gap: 5px;
    }
    nav .nav-toggle span {
      display: block;
      width: 20px;
      height: 1px;
      border-radius: 999px;
      background: var(--white);
    }
    nav .nav-mobile-menu { display: none; }
    .nav-scrolled {
      background: rgba(10, 10, 10, 0.72);
      backdrop-filter: blur(10px);
      border-bottom: none;
    }

    .container {
      max-width: var(--content-width);
      margin: 0 auto;
      padding: 0 56px;
    }

    .reveal {
      opacity: 0;
      transform: translateY(42px);
      transition: opacity 0.8s ease, transform 0.8s ease;
      will-change: opacity, transform;
    }
    .reveal.is-visible {
      opacity: 1;
      transform: translateY(0);
    }
    .reveal-delay-1 { transition-delay: 0.08s; }
    .reveal-delay-2 { transition-delay: 0.16s; }

    .hero-contacto {
      padding: 150px 0 46px;
      text-align: center;
    }
    .hero-contacto h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(60px, 9vw, 96px);
      font-weight: 400;
      line-height: 0.96;
      margin-bottom: 30px;
    }

    .contact-socials {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
    }
    .contact-socials a {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.96);
      color: #111111;
      text-decoration: none;
      transition: transform .2s ease, opacity .2s ease;
    }
    .contact-socials a:hover {
      transform: translateY(-1px);
      opacity: 0.92;
    }
    .contact-socials svg {
      width: 19px;
      height: 19px;
      display: block;
      fill: currentColor;
    }

    .contact-panel-section {
      padding: 24px 0 140px;
    }
    .contact-panel {
      background: var(--panel-card);
      border: 1px solid #2b2b2b;
      border-radius: 24px;
      padding: 50px 56px 44px;
      display: grid;
      grid-template-columns: 332px minmax(0, 1fr);
      gap: 44px;
      align-items: center;
    }
    .contact-visual {
      width: 100%;
      max-width: 332px;
      aspect-ratio: 0.86 / 1;
      border-radius: 20px;
      overflow: hidden;
      background: #ffffff;
    }
    .contact-visual img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .contact-box h2 {
      font-size: 24px;
      line-height: 1.08;
      font-weight: 500;
      margin-bottom: 16px;
    }
    .contact-form {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .contact-form label {
      display: block;
      margin-bottom: 6px;
      color: var(--white);
      font-size: 14px;
      line-height: 1.3;
    }
    .contact-form input,
    .contact-form textarea {
      width: 100%;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.78);
      background: transparent;
      color: var(--white);
      font: inherit;
      padding: 12px 14px;
      outline: none;
    }
    .contact-form input::placeholder,
    .contact-form textarea::placeholder {
      color: #d9d9d9;
      opacity: 0.78;
    }
    .contact-form textarea {
      min-height: 128px;
      resize: vertical;
    }
    .contact-form button {
      margin-top: 2px;
      width: 170px;
      height: 42px;
      border: 0;
      border-radius: 10px;
      background: #ffffff;
      color: #111111;
      font: inherit;
      font-size: 15px;
      cursor: pointer;
      transition: opacity .2s ease;
    }
    .contact-form button:hover { opacity: 0.86; }
    .contact-message {
      min-height: 22px;
      color: #d9d9d9;
      font-size: 14px;
      line-height: 1.4;
      margin-top: 6px;
    }

    footer {
      padding: 28px 56px 40px;
      display: grid;
      grid-template-columns: 1fr auto;
      grid-template-rows: auto auto;
      row-gap: 26px;
      align-items: end;
    }
    footer .footer-left {
      font-size: 24px; color: #ffffff;
      grid-column: 1/2; grid-row: 1/2;
    }
    footer .footer-mid {
      display: flex; gap: 24px;
      grid-column: 1/2; grid-row: 2/3; flex-wrap: wrap;
    }
    footer .footer-mid a,
    footer .footer-right a {
      font-size: 14px;
      color: #d9d9d9;
      text-decoration: none;
    }
    footer .footer-right {
      display: flex; gap: 48px;
      grid-column: 2/3; grid-row: 2/3;
      align-self: end; flex-wrap: wrap;
    }

    @media (max-width: 1024px) {
      nav { padding: 0 26px; }
      nav .nav-left, nav .nav-right { gap: 18px; }
      nav a { font-size: 13px; }
      nav .nav-center { font-size: 18px; }
      .container, footer { padding-left: 24px; padding-right: 24px; }
      .contact-panel {
        grid-template-columns: 280px minmax(0, 1fr);
        gap: 28px;
        padding: 36px 36px 34px;
      }
      .contact-visual {
        max-width: 280px;
      }
    }

    @media (max-width: 640px) {
      nav { padding: 0 14px; height: 54px; }
      nav .nav-left, nav .nav-right { display: none; }
      nav .nav-center {
        position: static;
        transform: none;
        margin-right: auto;
        font-size: 20px;
        letter-spacing: 0.04em;
      }
      nav .nav-toggle { display: flex; margin-left: auto; }
      nav .nav-mobile-menu {
        display: flex;
        flex-direction: column;
        gap: 8px;
        position: absolute;
        top: 54px;
        left: 0;
        right: 0;
        padding: 14px 18px 16px;
        background: rgba(10,10,10,0.9);
        border-top: 1px solid rgba(255,255,255,0.12);
        border-bottom: 1px solid rgba(255,255,255,0.12);
        backdrop-filter: blur(8px);
        opacity: 0;
        pointer-events: none;
        transform-origin: top center;
        transform: scaleY(0.2);
        transition: opacity 0.22s ease, transform 0.24s ease;
      }
      nav.nav-open .nav-mobile-menu {
        opacity: 1;
        pointer-events: auto;
        transform: scaleY(1);
      }
      nav.nav-open {
        background: rgba(10,10,10,0.9);
        backdrop-filter: blur(8px);
      }
      .container, footer {
        padding-left: 18px;
        padding-right: 18px;
      }
      .hero-contacto {
        padding-top: 118px;
        padding-bottom: 34px;
      }
      .hero-contacto h1 {
        margin-bottom: 22px;
      }
      .contact-socials {
        gap: 10px;
      }
      .contact-socials a {
        width: 34px;
        height: 34px;
        border-radius: 9px;
      }
      .contact-panel-section {
        padding-top: 8px;
        padding-bottom: 86px;
      }
      .contact-panel {
        grid-template-columns: 1fr;
        gap: 26px;
        padding: 24px 22px 24px;
        border-radius: 20px;
      }
      .contact-visual {
        max-width: none;
        aspect-ratio: 1.08 / 1;
      }
      .contact-box h2 {
        font-size: 20px;
      }
      .contact-form button {
        width: 100%;
      }
      footer {
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding: 24px 18px 40px;
        position: relative;
      }
      footer::before {
        content: "";
        position: absolute;
        top: 10px;
        left: 18px;
        right: 18px;
        height: 1px;
        background: rgba(255,255,255,0.18);
      }
      footer .footer-left {
        margin-top: 14px;
        font-size: 22px;
        font-weight: 600;
        line-height: 1;
      }
      footer .footer-mid {
        flex-direction: row;
        flex-wrap: nowrap;
        gap: 0;
        opacity: 0.7;
      }
      footer .footer-mid a { font-size: 9px; }
      footer .footer-mid a:not(:last-child)::after {
        content: " · ";
        color: rgba(255,255,255,0.5);
      }
      footer .footer-right {
        flex-direction: column;
        gap: 8px;
        margin-top: 8px;
        width: 100%;
      }
      footer .footer-right a {
        font-size: 14px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
    }

    /* --- Footer: enlaces de sitio + copyright abajo a la izquierda --- */
    footer .footer-nav {
      display: flex;
      gap: 24px;
      grid-column: 2 / 3;
      grid-row: 1 / 2;
      align-self: end;
      justify-content: flex-end;
      flex-wrap: wrap;
    }
    footer .footer-nav a {
      font-size: 14px;
      color: #d9d9d9;
      text-decoration: none;
      transition: color .2s ease;
    }
    footer .footer-nav a:hover { color: #999999; }

    @media (max-width: 640px) {
      footer { align-items: flex-start; }
      footer .footer-nav {
        order: 1;
        justify-content: flex-start;
        gap: 18px;
        width: 100%;
      }
      footer .footer-mid { order: 2; }
      footer .footer-right { order: 3; }
      footer .footer-left {
        order: 4;
        margin-top: 20px;
      }
    }
  </style>
</head>
<body>

  <nav id="site-nav">
    <div class="nav-left">
      <a href="/#sobre-mi">Sobre Mí</a>
      <a href="proyectos.html">Proyectos</a>
    </div>
    <div class="nav-center"><a href="/">IVAN ZHENG</a></div>
    <div class="nav-right">
      <a href="productos.html">Productos</a>
      <a href="contacto.html">Contacto</a>
    </div>
    <button id="nav-toggle" class="nav-toggle" type="button" aria-label="Abrir menu" aria-expanded="false" aria-controls="nav-mobile-menu">
      <span></span>
      <span></span>
    </button>
    <div id="nav-mobile-menu" class="nav-mobile-menu">
      <a href="/">Inicio</a>
      <a href="/#sobre-mi">Sobre Mí</a>
      <a href="proyectos.html">Proyectos</a>
      <a href="productos.html">Productos</a>
      <a href="contacto.html">Contacto</a>
    </div>
  </nav>

  <section class="hero-contacto">
    <div class="container">
      <h1 class="reveal">Ponte en Contacto</h1>
      <div class="contact-socials reveal reveal-delay-1" aria-label="Redes sociales y email">
        <a href="https://www.instagram.com/theivanzheng/" target="_blank" rel="noopener noreferrer" aria-label="Instagram">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7.75 2h8.5A5.75 5.75 0 0 1 22 7.75v8.5A5.75 5.75 0 0 1 16.25 22h-8.5A5.75 5.75 0 0 1 2 16.25v-8.5A5.75 5.75 0 0 1 7.75 2Zm0 1.5A4.25 4.25 0 0 0 3.5 7.75v8.5a4.25 4.25 0 0 0 4.25 4.25h8.5a4.25 4.25 0 0 0 4.25-4.25v-8.5a4.25 4.25 0 0 0-4.25-4.25h-8.5Zm8.9 1.8a1.05 1.05 0 1 1 0 2.1 1.05 1.05 0 0 1 0-2.1ZM12 6.4A5.6 5.6 0 1 1 6.4 12 5.61 5.61 0 0 1 12 6.4Zm0 1.5A4.1 4.1 0 1 0 16.1 12 4.11 4.11 0 0 0 12 7.9Z"/></svg>
        </a>
        <a href="https://www.tiktok.com/@theivanzheng" target="_blank" rel="noopener noreferrer" aria-label="TikTok">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.56 2h2.32a5.06 5.06 0 0 0 1.46 3.23A5.2 5.2 0 0 0 22 6.64v2.34a7.39 7.39 0 0 1-4.95-1.9v7.01a5.95 5.95 0 1 1-5.95-5.95c.34 0 .66.03.98.08v2.39a3.57 3.57 0 1 0 2.48 3.4V2Z"/></svg>
        </a>
        <a href="mailto:info@theivanzheng.com" aria-label="Email">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5.5A2.5 2.5 0 0 1 5.5 3h13A2.5 2.5 0 0 1 21 5.5v13a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 18.5v-13Zm2.28-.98 6.38 5.08a.55.55 0 0 0 .68 0l6.38-5.08H5.28Zm14.22 1.92-6.23 4.96a2.05 2.05 0 0 1-2.54 0L4.5 6.44V18.5c0 .55.45 1 1 1h13c.55 0 1-.45 1-1V6.44Z"/></svg>
        </a>
      </div>
    </div>
  </section>

  <section class="contact-panel-section">
    <div class="container">
      <div class="contact-panel reveal">
        <div class="contact-visual reveal reveal-delay-1">
          <img src="./Resources/cards/contacto-1.jpg" alt="Imagen de contacto" loading="eager" decoding="async" />
        </div>
        <div class="contact-box reveal reveal-delay-2">
          <h2>Deja tu mensaje</h2>
          <form id="contact-form" class="contact-form" novalidate>
            <input id="contact-company" name="company" type="text" autocomplete="off" tabindex="-1" aria-hidden="true" style="position:absolute;left:-9999px;opacity:0;pointer-events:none;" />
            <div>
              <label for="contact-email">Correo Electrónico</label>
              <input id="contact-email" type="email" placeholder="tu@email.com" required />
            </div>
            <div>
              <label for="contact-subject">Asunto</label>
              <input id="contact-subject" type="text" placeholder="Ej. Propuesta de Desarrollo para mi Empresa" required />
            </div>
            <div>
              <label for="contact-message">Mensaje</label>
              <textarea id="contact-message" placeholder="Escribe tu mensaje aquí ..." required></textarea>
            </div>
            <button id="contact-submit" type="submit">Enviar</button>
            <p id="contact-response" class="contact-message" aria-live="polite"></p>
          </form>
        </div>
      </div>
    </div>
  </section>

  <footer>
    <div class="footer-left">© 2026 Iván Zheng</div>
    <div class="footer-nav">
      <a href="/#sobre-mi">Sobre Mí</a>
      <a href="proyectos.html">Proyectos</a>
      <a href="productos.html">Productos</a>
      <a href="contacto.html">Contacto</a>
    </div>
    <div class="footer-mid">
      <a href="aviso-legal.html">Aviso legal</a>
      <a href="politica-privacidad.html">Politica de privacidad</a>
      <a href="politica-cookies.html">Politica de cookies</a>
    </div>
    <div class="footer-right">
      <a href="https://www.instagram.com/theivanzheng/" target="_blank" rel="noopener noreferrer">INSTAGRAM</a>
      <a href="https://www.tiktok.com/@theivanzheng" target="_blank" rel="noopener noreferrer">TIKTOK</a>
      <a href="https://www.linkedin.com/in/theivanzheng" target="_blank" rel="noopener noreferrer">LINKEDIN</a>
    </div>
  </footer>

  <script>
    const revealItems = document.querySelectorAll(".reveal");
    const revealObserver = new IntersectionObserver((entries) => {
      entries.forEach((entry) => {
        if (entry.isIntersecting) {
          entry.target.classList.add("is-visible");
        }
      });
    }, { threshold: 0.18 });

    revealItems.forEach((item) => revealObserver.observe(item));

    const nav = document.getElementById("site-nav");
    const navToggle = document.getElementById("nav-toggle");
    const navMobileMenu = document.getElementById("nav-mobile-menu");
    const navLinks = navMobileMenu ? navMobileMenu.querySelectorAll("a") : [];

    const closeMobileNav = () => {
      if (!nav) {
        return;
      }
      nav.classList.remove("nav-open");
      if (navToggle) {
        navToggle.setAttribute("aria-expanded", "false");
      }
    };

    if (navToggle) {
      navToggle.addEventListener("click", () => {
        const isOpen = nav.classList.toggle("nav-open");
        navToggle.setAttribute("aria-expanded", String(isOpen));
      });
    }

    navLinks.forEach((link) => {
      link.addEventListener("click", () => {
        closeMobileNav();
      });
    });

    window.addEventListener("scroll", () => {
      if (nav) {
        nav.classList.toggle("nav-scrolled", window.scrollY > 24);
      }
    }, { passive: true });

    const isLocalPage = ["127.0.0.1", "localhost"].includes(window.location.hostname);
    const API_BASE_CANDIDATES = isLocalPage
      ? ["http://127.0.0.1:8787", "http://localhost:8787", window.location.origin]
      : [window.location.origin];

    const contactForm = document.getElementById("contact-form");
    const contactCompany = document.getElementById("contact-company");
    const contactEmail = document.getElementById("contact-email");
    const contactSubject = document.getElementById("contact-subject");
    const contactMessageField = document.getElementById("contact-message");
    const contactSubmit = document.getElementById("contact-submit");
    const contactResponse = document.getElementById("contact-response");

    const showContactMessage = (text, isError = false) => {
      if (!contactResponse) {
        return;
      }
      contactResponse.textContent = text;
      contactResponse.style.color = isError ? "#ff9f9f" : "#d9d9d9";
    };

    const parseJsonSafe = async (response) => {
      const type = response.headers.get("content-type") || "";
      if (!type.includes("application/json")) {
        return null;
      }
      try {
        return await response.json();
      } catch {
        return null;
      }
    };

    const postApiWithFallback = async (path, body) => {
      let lastError = null;

      for (const base of API_BASE_CANDIDATES) {
        try {
          const response = await fetch(`${base}${path}`, {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify(body)
          });

          if (response.status === 404 && API_BASE_CANDIDATES.length > 1) {
            continue;
          }

          return response;
        } catch (error) {
          lastError = error;
        }
      }

      throw lastError || new Error("No se pudo conectar con el servidor.");
    };

    if (contactForm) {
      contactForm.addEventListener("submit", async (event) => {
        event.preventDefault();

        const email = (contactEmail?.value || "").trim();
        const subject = (contactSubject?.value || "").trim();
        const message = (contactMessageField?.value || "").trim();

        if (!email || !subject || !message) {
          showContactMessage("Completa todos los campos del formulario.", true);
          return;
        }

        contactSubmit.disabled = true;
        showContactMessage("Enviando mensaje...");

        try {
          const response = await postApiWithFallback("/api/contact", {
            company: contactCompany?.value || "",
            email,
            subject,
            message
          });

          const payload = await parseJsonSafe(response);
          if (!response.ok || !payload?.ok) {
            throw new Error(payload?.error || "No se pudo enviar el mensaje.");
          }

          showContactMessage("Mensaje enviado. Te responderé lo antes posible.");
          contactForm.reset();
        } catch (error) {
          showContactMessage(error.message || "Error al enviar el mensaje.", true);
        } finally {
          contactSubmit.disabled = false;
        }
      });
    }
  </script>

</body>
